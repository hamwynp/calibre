<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calibre</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="shell">
    <aside class="side" id="side"></aside>
    <div id="app">
      <header class="top">
        <h1 id="title"></h1>
        <span id="subtitle" class="subtitle"></span>
        <span id="sync" class="sync"></span>
        <span id="calerr" class="calerr"></span>
        <span class="spacer"></span>
        <span id="weekhint" class="pill" hidden></span>
      </header>
      <div class="dayhead" id="dayhead"></div>
      <div class="scroll" id="scroll"><div class="inner" id="inner"></div></div>
      <div class="monthview" id="monthview" hidden></div>
      <div class="listview" id="listview" hidden></div>
    </div>
    </div>

    <div class="overlay" id="signin" hidden tabindex="-1">
      <div class="card signin">
        <h2>Connect Google Calendar</h2>
        <p id="signin-msg"></p>
        <button id="signin-btn" type="button">Sign in with Google</button>
        <p class="status" id="signin-status"></p>
      </div>
    </div>

    <div class="overlay" id="picker" hidden tabindex="-1">
      <div class="card picker">
        <h2>Calendars</h2>
        <div id="picker-list"></div>
      </div>
    </div>

    <div class="overlay" id="settings" hidden tabindex="-1">
      <div class="card settings">
        <h2>Settings</h2>
        <div id="settings-list"></div>
        <p class="status">j/k move · Space toggles · Esc closes</p>
      </div>
    </div>

    <div class="overlay" id="confirm" hidden tabindex="-1">
      <div class="card confirm">
        <h2 id="confirm-title"></h2>
        <p id="confirm-msg"></p>
        <div id="confirm-opts"></div>
        <div class="btns">
          <button type="button" id="confirm-cancel">Cancel <kbd>Esc</kbd></button>
          <button type="button" id="confirm-ok" class="danger">Delete <kbd>Enter</kbd></button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden>
      <form class="card" id="form" autocomplete="off">
        <h2 id="f-heading">New event</h2>
        <div class="row" id="f-scope-row" hidden>
          <span>Change</span>
          <div class="select" id="f-scope" tabindex="0"><span id="f-scope-name"></span><i id="f-scope-caret">▾</i></div>
        </div>
        <ul class="options" id="f-scope-list" hidden></ul>
        <label class="row"><span>Title</span><input id="f-title" /></label>
        <label class="row"><span>Date</span><input id="f-date" /></label>
        <label class="row"><span>Start</span><input id="f-start" /></label>
        <label class="row"><span>Length</span><input id="f-len" /></label>
        <div class="row">
          <span>Calendar</span>
          <div class="select" id="f-cal" tabindex="0"><span id="f-cal-name"></span><i id="f-cal-caret">▾</i></div>
        </div>
        <ul class="options" id="f-cal-list" hidden></ul>
        <div class="row" id="f-rep-row">
          <span>Repeat</span>
          <div class="select" id="f-rep" tabindex="0"><span id="f-rep-name"></span><i id="f-rep-caret">▾</i></div>
        </div>
        <ul class="options" id="f-rep-list" hidden></ul>
        <label class="row" id="f-until-row" hidden><span>Until</span><input id="f-until" /></label>
        <p class="status" id="f-status"></p>
      </form>
    </div>

    <div class="help" id="help" hidden></div>
  </body>
</html>
